eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
spring.application.name=api-gateway
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

# Route for user-account service
spring.cloud.gateway.routes[0].id=user-account
spring.cloud.gateway.routes[0].uri=lb://user-account
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Route for loan-management service

spring.cloud.gateway.routes[1].id=loan-management-lender
spring.cloud.gateway.routes[1].uri=lb://loan-management
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/lender/**

spring.cloud.gateway.routes[2].id=loan-management-borrow
spring.cloud.gateway.routes[2].uri=lb://loan-management
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/borrow/**

